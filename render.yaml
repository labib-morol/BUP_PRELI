# Render blueprint - one-click deploy of the fallback-capable service.
#
#   Render dashboard -> New -> Blueprint -> pick this repository -> Apply
#   Then set GEMINI_API_KEY in the service's Environment tab (it is never stored here).
#
# The free plan spins a service down after 15 minutes without traffic; add a free
# uptime monitor (e.g. UptimeRobot, 5-minute interval) pointed at /health so the
# container is always warm when the judge calls it. See docs/EXECUTION.md.
services:
  - type: web
    name: gridwise-llm
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GRIDWISE_GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GRIDWISE_GEMINI_MODEL_2
        value: gemini-3.1-flash-lite
      - key: GRIDWISE_GROQ_MODEL
        value: openai/gpt-oss-20b
      # Two providers in parallel. With one provider, a quota-exhausted primary
      # costs about 10s of sequential recovery per request; in parallel the second
      # provider answers immediately and the request stays inside the 5s band.
      - key: GRIDWISE_CONSENSUS
        value: "2"
      - key: GRIDWISE_LLM_TIMEOUT
        value: "10"
      - key: GRIDWISE_LLM_BUDGET
        value: "8.0"
      - key: GRIDWISE_LLM_DEADLINE
        value: "20"
      - key: GROQ_API_KEY
        sync: false
